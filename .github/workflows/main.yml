name: "RDP-ProAccess (APEX-ULTIMA) v3.1 — Sovereign Apex Fabric"

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (e.g. you@gmail.com)"
        required: true
      quick_test:
        description: "5-minute smoke test"
        type: boolean
        default: false
      runtime_minutes:
        description: "Runtime minutes (1-355 recommended; max 358)"
        required: false
        default: "355"
      cycles:
        description: "0 = stop; N = remaining handoffs. Hard cap 24."
        required: false
        default: "0"
      rdp_count:
        description: "Parallel RDP instances (1-10)"
        required: false
        default: "1"
      enable_heartbeat:
        description: "Heartbeat + telemetry during session"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

env:
  APEX_VERSION: "3.1.0-SOVEREIGN-APEX-FABRIC"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      multi:  ${{ steps.mk.outputs.multi }}
    steps:
      - id: mk
        shell: pwsh
        env:
          COUNT: ${{ inputs.rdp_count }}
        run: |
          $n = 1
          try { $n = [math]::Max(1, [math]::Min(10, [int]$env:COUNT)) } catch { $n = 1 }
          $inc = @()
          for ($i = 1; $i -le $n; $i++) { $inc += [pscustomobject]@{ id = $i } }
          $matrixObj = [pscustomobject]@{ include = $inc }
          $matrixJson = $matrixObj | ConvertTo-Json -Compress -Depth 5
          "matrix=$matrixJson" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "multi=$([int]($n -gt 1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  rdp:
    needs: setup
    runs-on: windows-latest
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false
    timeout-minutes: 360

    env:
      TS_KEY:        ${{ secrets.TAILSCALE_AUTH_KEY }}
      PASS:          ${{ secrets.RDP_PASSWORD }}
      TG_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT:       ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_PAT:        ${{ secrets.GH_PAT }}
      RDP_USER:      ProAccessVIP
      TS_TAILNET:    ${{ inputs.ts_tailnet }}
      QUICK_TEST:    ${{ inputs.quick_test }}
      RUNTIME_INPUT: ${{ inputs.runtime_minutes }}
      CYCLES_INPUT:  ${{ inputs.cycles }}
      ENABLE_HEARTBEAT: ${{ inputs.enable_heartbeat }}
      MATRIX_ID:     ${{ matrix.id }}
      MULTI_FLAG:    ${{ needs.setup.outputs.multi }}

    steps:
      - name: "🚀 APEX-ULTIMA Sovereign Fabric (Single-Step Execution)"
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          # ════════════════════════════════════════════════════════════════════
          # CORE FUNCTIONS & STATE
          # ════════════════════════════════════════════════════════════════════
          $ErrorActionPreference = 'Continue'
          $Global:Apex = [ordered]@{
              Version          = $env:APEX_VERSION
              MatrixId         = [int]$env:MATRIX_ID
              IsMulti          = $env:MULTI_FLAG -eq '1'
              Hostname         = if ($env:MULTI_FLAG -eq '1') { "bullet$($env:MATRIX_ID)" } else { "bullet" }
              RuntimeMinutes   = 355
              TailscaleIP      = $null
              StartTime        = Get-Date
              EventsLog        = "C:\Setup\apex-events.jsonl"
              MetricsLog       = "C:\Setup\apex-metrics.jsonl"
              DashboardPath    = "C:\Setup\apex-dashboard.html"
              LineageRunId     = $env:GITHUB_RUN_ID
          }
          New-Item -ItemType Directory -Path "C:\Setup\logs","C:\Setup\downloads" -Force | Out-Null
          Start-Transcript -Path "C:\Setup\logs\apex_full.log" -Append
          
          function Write-ApexEvent {
              param([ValidateSet('INFO','WARN','ERROR','SUCCESS','DEBUG')][string]$Level='INFO', [Parameter(Mandatory)][string]$Message)
              try {
                  $evt = [ordered]@{ ts = (Get-Date).ToString("o"); level = $Level; msg = $Message; matrix = $Global:Apex.MatrixId; run_id = $Global:Apex.LineageRunId }
                  Add-Content -Path $Global:Apex.EventsLog -Value ($evt | ConvertTo-Json -Compress -Depth 6) -Encoding utf8
              } catch {}
              $color = @{ ERROR='Red'; WARN='Yellow'; SUCCESS='Green'; INFO='Cyan'; DEBUG='DarkGray' }[$Level]
              if (-not $color) { $color = 'White' }
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] [$Level] $Message" -ForegroundColor $color
          }
          function Write-ApexMetric { param([hashtable]$Metrics) try { $m = [ordered]@{ ts = (Get-Date).ToString("o"); matrix = $Global:Apex.MatrixId } + $Metrics; Add-Content -Path $Global:Apex.MetricsLog -Value ($m | ConvertTo-Json -Compress -Depth 6) -Encoding utf8 } catch {} }
          function Wait-ApexService { param([Parameter(Mandatory)][string]$Name, [int]$TimeoutSec=90) $deadline = (Get-Date).AddSeconds($TimeoutSec); while ((Get-Date) -lt $deadline) { $svc = Get-Service $Name -ErrorAction SilentlyContinue; if ($svc -and $svc.Status -in 'Running','StartPending') { return $true }; Start-Sleep -Seconds 3 }; return $false }
          function Get-SystemMetrics {
              try {
                  $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
                  $cpu = 0.0; try { $cpu = (Get-Counter '\Processor(_Total)\% Processor Time' -SampleInterval 1 -MaxSamples 1 -ErrorAction SilentlyContinue).CounterSamples.CookedValue } catch {}
                  $net = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' } | Select-Object -First 1
                  $stats = if ($net) { $net | Get-NetAdapterStatistics -ErrorAction SilentlyContinue } else { $null }
                  $disk = Get-PSDrive C -ErrorAction SilentlyContinue
                  return [ordered]@{ ts=(Get-Date).ToString("o"); free_ram_gb=if($os){[math]::Round($os.FreePhysicalMemory/1MB,2)}else{0}; cpu_load_pct=[math]::Round($cpu,1); c_free_gb=if($disk){[math]::Round($disk.Free/1GB,2)}else{0}; net_sent_mb=if($stats){[math]::Round($stats.SentBytes/1MB,2)}else{0}; net_recv_mb=if($stats){[math]::Round($stats.ReceivedBytes/1MB,2)}else{0}; tailscale_up=(Test-TailscaleHealth) }
              } catch { return [ordered]@{ ts=(Get-Date).ToString("o"); error=$_.Exception.Message } }
          }
          function Test-TailscaleHealth { param([string]$TsPath = "C:\Program Files\Tailscale\tailscale.exe") if (-not (Test-Path $TsPath)) { return $false }; try { $status = & $TsPath status --json 2>$null | ConvertFrom-Json -ErrorAction SilentlyContinue; return ($status -and $status.BackendState -eq "Running") } catch { return $false } }
          function Get-TailscaleIP { param([string]$TsPath = "C:\Program Files\Tailscale\tailscale.exe") try { $ip = (& $TsPath ip -4 2>$null | Out-String).Trim(); if ($ip -match '^\d{1,3}(\.\d{1,3}){3}$') { return $ip } } catch {}; return $null }
          function Test-RdpHealth { $svc = Get-Service TermService -ErrorAction SilentlyContinue; if (-not $svc -or $svc.Status -ne 'Running') { return $false }; $udp = Get-NetUDPEndpoint -LocalPort 3389 -ErrorAction SilentlyContinue; return [bool]$udp }
          function Send-ApexTelegram { param([Parameter(Mandatory)][string]$Text, [int]$MaxRetries=3) if (-not $env:TG_TOKEN -or -not $env:TG_CHAT) { return $false }; try { $body = @{ chat_id=$env:TG_CHAT; text=$Text; disable_web_page_preview=$true }; Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TG_TOKEN)/sendMessage" -Method Post -Body $body -ErrorAction Stop | Out-Null; return $true } catch { return $false } }
          function Write-ApexDashboard {
              try {
                  $m = Get-SystemMetrics; $tsIp = if ($Global:Apex.TailscaleIP) { $Global:Apex.TailscaleIP } else { '(pending)' }
                  $uptime = [math]::Round(((Get-Date) - $Global:Apex.StartTime).TotalMinutes, 1)
                  $events = Get-Content $Global:Apex.EventsLog -Tail 8 -ErrorAction SilentlyContinue | ForEach-Object { try { $_ | ConvertFrom-Json } catch {} }
                  $evtRows = $events | ForEach-Object { "<tr><td>$($_.ts)</td><td>$($_.level)</td><td>$($_.msg)</td></tr>" }
                  $html = "<!doctype html><html><head><meta charset='utf-8'><title>APEX</title><meta http-equiv='refresh' content='15'><style>body{font-family:system-ui;background:#0a0e1a;color:#e0e6ed;padding:20px}table{width:100%;border-collapse:collapse}td,th{padding:8px 12px;border-bottom:1px solid #1f2a44}th{background:#1a2238;color:#00d4ff;text-align:left}</style></head><body><h1>APEX-ULTIMA v$($Global:Apex.Version)</h1><p>Matrix $($Global:Apex.MatrixId) • Host $($Global:Apex.Hostname) • Tailscale $tsIp • Uptime ${uptime}m</p><table><tr><th>RAM Free (GB)</th><th>CPU %</th><th>Disk Free (GB)</th><th>Net Sent (MB)</th><th>Net Recv (MB)</th></tr><tr><td>$($m.free_ram_gb)</td><td>$($m.cpu_load_pct)</td><td>$($m.c_free_gb)</td><td>$($m.net_sent_mb)</td><td>$($m.net_recv_mb)</td></tr></table><br><table><thead><tr><th>Time</th><th>Level</th><th>Event</th></tr></thead><tbody>$evtRows</tbody></table></body></html>"
                  $html | Set-Content -Path $Global:Apex.DashboardPath -Encoding utf8 -ErrorAction SilentlyContinue
              } catch {}
          }
          function New-ApexIdleTask {
              param([int]$RuntimeMinutes)
              $idleScript = "C:\Setup\IdleSim.ps1"
              $idleLines = @("Add-Type -AssemblyName System.Windows.Forms", "`$end = (Get-Date).AddMinutes($RuntimeMinutes)", "while ((Get-Date) -lt `$end) {", "    try {", "        `$p = [Windows.Forms.Cursor]::Position", "        [Windows.Forms.Cursor]::Position = New-Object Drawing.Point(`$p.X + 1, `$p.Y)", "        Start-Sleep -Milliseconds 60", "        [Windows.Forms.Cursor]::Position = `$p", "        [Windows.Forms.SendKeys]::SendWait('{SCROLLLOCK}')", "        Start-Sleep -Milliseconds 40", "        [Windows.Forms.SendKeys]::SendWait('{SCROLLLOCK}')", "    } catch {}", "    Start-Sleep -Seconds 38", "}")
              Set-Content $idleScript -Value ($idleLines -join "`n") -Encoding utf8
              $action = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$idleScript`""
              $trigger = New-ScheduledTaskTrigger -AtStartup
              $principal = New-ScheduledTaskPrincipal -UserId "NT AUTHORITY\SYSTEM" -LogonType ServiceAccount -RunLevel Highest
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
              Register-ScheduledTask -TaskName "APEX-IdleJiggler" -Action $action -Trigger $trigger -Principal $principal -Settings $settings -Force | Out-Null
              Start-ScheduledTask -TaskName "APEX-IdleJiggler" -ErrorAction SilentlyContinue
          }
          function Get-ApexFile {
              param([Parameter(Mandatory)][string]$Url, [Parameter(Mandatory)][string]$OutDir, [Parameter(Mandatory)][string]$OutName)
              $dest = Join-Path $OutDir $OutName; if (Test-Path $dest) { return $dest }
              $aria = (Get-Command aria2c.exe -ErrorAction SilentlyContinue).Source
              if (-not $aria -and (Test-Path "C:\ProgramData\chocolatey\bin\aria2c.exe")) { $aria = "C:\ProgramData\chocolatey\bin\aria2c.exe" }
              if ($aria) { $a = @("--dir=$OutDir","--out=$OutName","--max-connection-per-server=16","--split=16","--min-split-size=1M","--max-tries=6","--retry-wait=3","--connect-timeout=20","--timeout=90","--auto-file-renaming=false","--allow-overwrite=true","--console-log-level=warn","--check-certificate=true",$Url); for ($i=1; $i -le 2; $i++) { & $aria @a 2>&1 | Out-Null; if ($LASTEXITCODE -eq 0 -and (Test-Path $dest)) { break }; Start-Sleep -Seconds (3 * $i) } }
              if (-not (Test-Path $dest)) { try { Start-BitsTransfer -Source $Url -Destination $dest -ErrorAction Stop } catch {} }
              if (-not (Test-Path $dest)) { Invoke-WebRequest -Uri $Url -OutFile $dest -UseBasicParsing -ErrorAction Stop }
              return $dest
          }
          function Compress-ApexLogs { param([string]$OutPath = "C:\Setup\apex-logs.zip") try { $files = @("C:\Setup\logs\*.log","C:\Setup\apex-events.jsonl","C:\Setup\apex-metrics.jsonl","C:\Setup\preflight.json","C:\Setup\apex-dashboard.html","C:\Setup\apex-summary.html"); Compress-Archive -Path $files -DestinationPath $OutPath -Force -ErrorAction Stop; return $OutPath } catch { return $null } }
          function Write-ApexSummaryHtml {
              param([hashtable]$Checks, [hashtable]$Metrics)
              $rows = $Checks.Keys | ForEach-Object { "<tr><td>$_</td><td>$(if($Checks[$_]){'✅ PASS'}else{'❌ FAIL'})</td></tr>" }
              $html = "<!doctype html><html><head><meta charset='utf-8'><title>APEX Run Summary</title><style>body{font-family:system-ui;background:#0a0e1a;color:#e0e6ed;padding:20px}table{width:100%;border-collapse:collapse}td,th{padding:8px 12px;border-bottom:1px solid #1f2a44}th{background:#1a2238;color:#00d4ff;text-align:left}</style></head><body><h1>APEX-ULTIMA v$($Global:Apex.Version) — Run Summary</h1><p>Matrix $($Global:Apex.MatrixId) • Host $($Global:Apex.Hostname) • Tailscale $($Global:Apex.TailscaleIP)</p><table><tr><th>Check</th><th>Status</th></tr>$rows</table><h2>Final metrics</h2><pre>$($Metrics | ConvertTo-Json -Depth 6)</pre></body></html>"
              $html | Set-Content "C:\Setup\apex-summary.html" -Encoding utf8
          }

          # ════════════════════════════════════════════════════════════════════
          # EXECUTION
          # ════════════════════════════════════════════════════════════════════
          Write-Host "═══════════════════════════════════════════════════════════════" -ForegroundColor Cyan
          Write-Host "  APEX-ULTIMA v${env:APEX_VERSION} (Lean Tailscale Fabric)" -ForegroundColor Cyan
          Write-Host "═══════════════════════════════════════════════════════════════" -ForegroundColor Cyan
          
          $rt = if ([bool]::Parse($env:QUICK_TEST)) { 5 } elseif ([int]$env:RUNTIME_INPUT -ge 1 -and [int]$env:RUNTIME_INPUT -le 358) { [int]$env:RUNTIME_INPUT } else { 355 }
          $Global:Apex.RuntimeMinutes = $rt
          Write-ApexEvent 'INFO' "Hostname: $($Global:Apex.Hostname) | Runtime: ${rt}m | Multi: $($Global:Apex.IsMulti)"

          try { choco install aria2 -y --no-progress --limit-output --timeout 90 2>&1 | Out-Null } catch {}
          try { Get-ApexFile -Url "https://pkgs.tailscale.com/stable/tailscale-setup-1.98.8-amd64.msi" -OutDir "C:\Setup\downloads" -OutName "tailscale.msi" | Out-Null } catch { Write-ApexEvent 'WARN' "Tailscale download failed" }

          powercfg /change standby-timeout-ac 0; powercfg /change monitor-timeout-ac 0; powercfg /change hibernate-timeout-ac 0; powercfg /hibernate off
          reg add "HKLM\Software\Policies\Microsoft\Windows\Personalization" /v NoLockScreen /t REG_DWORD /d 1 /f | Out-Null
          try { w32tm /config /manualpeerlist:"time.cloudflare.com,0x8 pool.ntp.org,0x8" /syncfromflags:manual /reliable:yes /update | Out-Null; Restart-Service w32time -Force -ErrorAction SilentlyContinue; w32tm /resync /force | Out-Null } catch {}

          # Kernel Tuning
          try { Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class TimerRes {[DllImport("ntdll.dll")] public static extern int NtSetTimerResolution(uint d, bool s, out uint c);}' -ErrorAction Stop; [TimerRes]::NtSetTimerResolution(5000, $true, [ref]([uint32]0)) | Out-Null } catch {}
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 | Out-Null
          $scheme = (powercfg -list | Select-String "e9a42b02-d5df-448d-aa00-03f14749eb61").Line
          if ($scheme -match "([0-9a-f-]{36})") { powercfg -setactive $Matches[1] } else { powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c }
          @("SUB_PROCESSOR PROCTHROTTLEMIN 100","SUB_PROCESSOR PROCTHROTTLEMAX 100","SUB_PROCESSOR PERFBOOSTMODE 2","SUB_PROCESSOR CPMINCORES 100","SUB_PROCESSOR CPMAXCORES 100","SUB_PROCESSOR IDLEDISABLE 1","SUB_PCIEXPRESS ASPM 0") | ForEach-Object { powercfg -setacvalueindex SCHEME_CURRENT $_ }
          powercfg -setactive SCHEME_CURRENT

          $bloat = @("wuauserv","DoSvc","SysMain","DiagTrack","WSearch","BITS","MapsBroker","EdgeUpdate","Spooler","WerSvc","RetailDemo","XblAuthManager","XblGameSave","dmwappushservice","PcaSvc","Fax","WbioSrvc","Themes","TabletInputService","wercplsupport")
          $bloat | ForEach-Object { Stop-Service $_ -Force -ErrorAction SilentlyContinue; Set-Service $_ -StartupType Disabled -ErrorAction SilentlyContinue }
          try { Set-MpPreference -DisableRealtimeMonitoring $true -DisableIOAVProtection $true -DisableArchiveScanning $true -DisableBehaviorMonitoring $true -SubmitSamplesConsent 2 -Force -ErrorAction Stop; Set-MpPreference -ExclusionPath "C:\","D:\" -Force -ErrorAction SilentlyContinue } catch {}
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Windows Defender" /v DisableAntiSpyware /t REG_DWORD /d 1 /f | Out-Null

          $rdpTcp = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"; $tsCtrl = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"; $tsPol  = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (-not (Test-Path $tsPol)) { New-Item $tsPol -Force | Out-Null }
          Set-ItemProperty $rdpTcp ColorDepth 5 -Type DWord -Force; Set-ItemProperty $rdpTcp MinSendInterval 3 -Type DWord -Force
          Set-ItemProperty $tsPol  SelectTransport 0 -Type DWord -Force; Set-ItemProperty $tsPol  fClientDisableUDP 0 -Type DWord -Force; Set-ItemProperty $tsPol  fServerDisableUDP 0 -Type DWord -Force
          Set-ItemProperty $tsCtrl KeepAliveEnable 1 -Type DWord -Force; Set-ItemProperty $tsCtrl KeepAliveInterval 1 -Type DWord -Force
          Set-ItemProperty $rdpTcp fEnableCompression 1 -Type DWord -Force; Set-ItemProperty $rdpTcp fEnableAutoReconnect 1 -Type DWord -Force
          Set-ItemProperty $rdpTcp BitmapCacheSize 4096 -Type DWord -Force; Set-ItemProperty $rdpTcp fEnablePersistentBitmapCaching 1 -Type DWord -Force
          Set-ItemProperty $rdpTcp fAutoClientDrives 0 -Type DWord -Force; Set-ItemProperty $rdpTcp fAutoClientLpts 0 -Type DWord -Force
          Set-ItemProperty $rdpTcp SecurityLayer 1 -Type DWord -Force; Set-ItemProperty $rdpTcp UserAuthentication 0 -Type DWord -Force
          Set-ItemProperty $tsPol  fEnableSmartCard 0 -Type DWord -Force; Set-ItemProperty $tsPol  fPromptForPassword 0 -Type DWord -Force
          Set-ItemProperty $tsPol  fDisableCam 1 -Type DWord -Force; Set-ItemProperty $tsPol  fDisableLPT 1 -Type DWord -Force
          Set-ItemProperty $tsPol  fDisableCcm 1 -Type DWord -Force; Set-ItemProperty $tsPol  fDisableClip 0 -Type DWord -Force
          Set-ItemProperty $tsPol "AVC444ModePreferred" 1 -Type DWord -Force -ErrorAction SilentlyContinue; Set-ItemProperty $tsPol "AVCHardwareEncodePreferred" 0 -Type DWord -Force -ErrorAction SilentlyContinue

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "RDP-UDP-3389-In" -Direction Inbound -LocalPort 3389 -Protocol UDP -Action Allow -ErrorAction SilentlyContinue | Out-Null

          Get-ChildItem "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces" -ErrorAction SilentlyContinue | ForEach-Object { Set-ItemProperty $_.PSPath TcpAckFrequency 1 -Type DWord -Force -ErrorAction SilentlyContinue; Set-ItemProperty $_.PSPath TCPNoDelay 1 -Type DWord -Force -ErrorAction SilentlyContinue }
          Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object Status -eq 'Up' | Disable-NetAdapterPowerManagement -ErrorAction SilentlyContinue
          netsh int tcp set global fastopen=enabled fastopenfallback=enabled timestamps=enabled windowscaling=enabled sackopts=enabled ecncapability=enabled initialRto=2000 2>$null | Out-Null
          netsh int tcp set global autotuninglevel=experimental rss=enabled 2>$null | Out-Null
          try { Set-NetTCPSetting -SettingName InternetCustom -CongestionProvider BBR2 -InitialRto 2000 -MinRto 300 -ErrorAction Stop } catch { try { Set-NetTCPSetting -SettingName InternetCustom -CongestionProvider CUBIC -InitialRto 2000 -MinRto 300 -ErrorAction Stop } catch { netsh int tcp set supplemental template=internet congestionprovider=ctcp 2>$null | Out-Null } }
          Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object Status -eq 'Up' | ForEach-Object { Enable-NetAdapterRss -Name $_.Name -ErrorAction SilentlyContinue; Enable-NetAdapterRsc -Name $_.Name -ErrorAction SilentlyContinue }
          
          $afd = "HKLM:\SYSTEM\CurrentControlSet\Services\AFD\Parameters"; if (-not (Test-Path $afd)) { New-Item $afd -Force | Out-Null }
          Set-ItemProperty $afd FastSendDatagramThreshold 1500 -Type DWord -Force; Set-ItemProperty $afd DefaultReceiveWindow 4194304 -Type DWord -Force; Set-ItemProperty $afd DefaultSendWindow 4194304 -Type DWord -Force
          $tcp = "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters"
          Set-ItemProperty $tcp MaximumReassemblyHeaders 0xffff -Type DWord -Force; Set-ItemProperty $tcp MaxUserPort 65534 -Type DWord -Force; Set-ItemProperty $tcp TcpNumConnections 0xfffffe -Type DWord -Force
          Set-ItemProperty $tcp TcpTimedWaitDelay 30 -Type DWord -Force; Set-ItemProperty $tcp KeepAliveTime 30000 -Type DWord -Force; Set-ItemProperty $tcp KeepAliveInterval 1000 -Type DWord -Force
          $mm = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile"
          Set-ItemProperty $mm NetworkThrottlingIndex 0xffffffff -Force; Set-ItemProperty $mm SystemResponsiveness 0 -Force
          New-NetQosPolicy -Name "RDP-QoS" -AppPathNameMatchCondition "svchost.exe" -DSCPAction 46 -NetworkProfile All -ErrorAction SilentlyContinue | Out-Null
          New-NetQosPolicy -Name "Tailscale-QoS" -AppPathNameMatchCondition "tailscaled.exe" -DSCPAction 46 -NetworkProfile All -ErrorAction SilentlyContinue | Out-Null
          $iface = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.Status -eq 'Up' -and $_.InterfaceDescription -notmatch "Tailscale" } | Select-Object -First 1
          if ($iface) { Set-DnsClientServerAddress -InterfaceIndex $iface.InterfaceIndex -ServerAddresses ("1.1.1.1","1.0.0.1") }

          if (-not $env:PASS) { Write-ApexEvent 'ERROR' "RDP_PASSWORD secret missing"; exit 1 }
          $u = $env:RDP_USER; $sec = ConvertTo-SecureString $env:PASS -AsPlainText -Force
          if (-not (Get-LocalUser $u -ErrorAction SilentlyContinue)) { New-LocalUser -Name $u -Password $sec -Description "APEX-ULTIMA" -AccountNeverExpires | Out-Null } else { Set-LocalUser -Name $u -Password $sec -AccountNeverExpires; Enable-LocalUser $u }
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          Set-ItemProperty $tsCtrl fDenyTSConnections 0 -Force
          netsh advfirewall firewall add rule name="APEX-Block-SMB-Out" dir=out action=block protocol=TCP localport=445 2>$null | Out-Null
          netsh advfirewall firewall add rule name="APEX-Block-WinRM-In" dir=in action=block protocol=TCP localport=5985,5986 2>$null | Out-Null

          # Tailscale
          if (-not $env:TS_KEY) { Write-ApexEvent 'ERROR' "TAILSCALE_AUTH_KEY missing"; exit 1 }
          $tsMsi = "C:\Setup\downloads\tailscale.msi"
          if (Test-Path $tsMsi) { Start-Process msiexec.exe -ArgumentList "/i","`"$tsMsi`"","/quiet","/norestart" -Wait } else { winget install --id Tailscale.Tailscale -e --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>$null | Out-Null }
          $env:Path = [Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [Environment]::GetEnvironmentVariable("Path","User")
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          & $ts logout 2>$null | Out-Null
          & $ts up --authkey="$($env:TS_KEY)" --hostname="$($Global:Apex.Hostname)" --unattended --accept-routes --accept-dns=$false --exit-node-allow-lan-access 2>&1 | Out-Null
          $ip = $null; $deadline = (Get-Date).AddSeconds(60)
          while (-not $ip -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2; $ip = Get-TailscaleIP -TsPath $ts }
          if (-not $ip) { Write-ApexEvent 'ERROR' "No Tailscale IPv4 after 60s"; exit 1 }
          $Global:Apex.TailscaleIP = $ip
          
          $tsAdapter = Get-NetAdapter -ErrorAction SilentlyContinue | Where-Object { $_.InterfaceDescription -match "Tailscale" } | Select-Object -First 1
          if ($tsAdapter) { netsh interface ipv4 set subinterface "$($tsAdapter.Name)" mtu=1280 store=persistent 2>$null | Out-Null; Disable-NetAdapterPowerManagement -Name $tsAdapter.Name -ErrorAction SilentlyContinue; Enable-NetAdapterRss -Name $tsAdapter.Name -ErrorAction SilentlyContinue }
          try {
              Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue | Set-NetFirewallRule -Enabled False -ErrorAction SilentlyContinue
              Get-NetFirewallRule -DisplayName "RDP-UDP-3389-In" -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
              New-NetFirewallRule -DisplayName "APEX-RDP-TCP-Tailscale-Only" -Direction Inbound -LocalPort 3389 -Protocol TCP -Action Allow -RemoteAddress $ip -ErrorAction SilentlyContinue | Out-Null
              New-NetFirewallRule -DisplayName "APEX-RDP-UDP-Tailscale-Only" -Direction Inbound -LocalPort 3389 -Protocol UDP -Action Allow -RemoteAddress $ip -ErrorAction SilentlyContinue | Out-Null
          } catch {}
          Send-ApexTelegram "🟢 APEX-ULTIMA v3.1 Login | IP: $ip | Host: $($Global:Apex.Hostname) | Matrix: $($Global:Apex.MatrixId) | Fabric Active" | Out-Null

          # File Prep
          $ram = if (Test-Path "D:\") { "D:\ApexRamDisk" } else { "C:\Setup\ApexRamDisk" }
          New-Item "$ram\Temp" -ItemType Directory -Force | Out-Null
          [Environment]::SetEnvironmentVariable("TEMP", "$ram\Temp", "Machine"); [Environment]::SetEnvironmentVariable("TMP",  "$ram\Temp", "Machine")
          $sessMin = $Global:Apex.RuntimeMinutes
          $timerLines = @("Add-Type -AssemblyName System.Windows.Forms,System.Drawing", "`$f = New-Object Windows.Forms.Form", "`$f.TopMost = `$true; `$f.FormBorderStyle = 'None'; `$f.BackColor = 'Black'; `$f.Opacity = 0.85", "`$f.Size = New-Object Drawing.Size(160,32); `$f.StartPosition = 'Manual'; `$f.Location = New-Object Drawing.Point(12,12)", "`$l = New-Object Windows.Forms.Label; `$l.Dock = 'Fill'; `$l.ForeColor = 'Lime'; `$l.Font = New-Object Drawing.Font('Consolas',12,[Drawing.FontStyle]::Bold); `$l.TextAlign = 'MiddleCenter'", "`$f.Controls.Add(`$l)", "`$end = (Get-Date).AddMinutes($sessMin)", "`$t = New-Object Windows.Forms.Timer; `$t.Interval = 1000", "`$t.Add_Tick({ `$ts = New-TimeSpan -Start (Get-Date) -End `$end; if (`$ts.TotalSeconds -le 0) { `$f.Close() } else { `$l.Text = 'APEX ' + `$ts.ToString('hh\:mm\:ss') + ' | $($Global:Apex.Hostname)' } })", "`$t.Start()", "[Windows.Forms.Application]::Run(`$f)")
          Set-Content "C:\Setup\Timer.ps1" -Value ($timerLines -join "`n") -Encoding utf8
          Set-Content "C:\Setup\Launcher.vbs" -Value 'CreateObject("Wscript.Shell").Run "powershell -NoProfile -ExecutionPolicy Bypass -File C:\Setup\Timer.ps1",0,False' -Encoding utf8
          New-ApexIdleTask -RuntimeMinutes $sessMin
          @("@echo off","echo [APEX-ULTIMA v3.1] Sovereign ignition...","start """" wscript.exe ""C:\Setup\Launcher.vbs""") | Set-Content "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp\Boot.bat" -Encoding ascii

          # Pre-flight
          $checks = [ordered]@{}
          $checks["TermService"] = ((Get-Service TermService -ErrorAction SilentlyContinue).Status -eq 'Running')
          $checks["RDP-3389-UDP"] = [bool](Get-NetUDPEndpoint -LocalPort 3389 -ErrorAction SilentlyContinue)
          $checks["Tailscale-IPv4"] = (Get-TailscaleIP) -match '^\d{1,3}(\.\d{1,3}){3}$'
          $checks["Tailscale-Health"] = Test-TailscaleHealth
          $checks["IdleTask-Registered"]= [bool](Get-ScheduledTask -TaskName "APEX-IdleJiggler" -ErrorAction SilentlyContinue)
          $checks["RDP-Firewall-TS-Scoped"] = [bool](Get-NetFirewallRule -DisplayName "APEX-RDP-TCP-Tailscale-Only" -ErrorAction SilentlyContinue)
          $allGreen = $true; foreach ($k in $checks.Keys) { if (-not $checks[$k]) { $allGreen = $false }; Write-Host "  $(if($checks[$k]){'✅'}else{'❌'}) $k" -ForegroundColor $(if($checks[$k]){'Green'}else{'Red'}) }
          Write-ApexMetric (Get-SystemMetrics); Write-ApexDashboard
          $preflight = [ordered]@{ timestamp=(Get-Date).ToString("o"); checks=$checks; all_green=$allGreen; matrix_id=$Global:Apex.MatrixId }
          $preflight | ConvertTo-Json -Depth 6 | Set-Content "C:\Setup\preflight.json"

          # Session Hold
          if (-not $Global:Apex.TailscaleIP) { Write-ApexEvent 'WARN' "No Tailscale IP — skipping hold"; Stop-Transcript; exit 0 }
          $endTime = (Get-Date).AddMinutes($Global:Apex.RuntimeMinutes)
          Write-ApexEvent 'SUCCESS' "APEX-ULTIMA v3.1 SOVEREIGN SESSION ACTIVE"

          $sentinel = {
              param($TsPath, $AuthKey, $Hostname, $MatrixId, $EventsLog, $EndTime)
              while ((Get-Date) -lt $EndTime) {
                  Start-Sleep -Seconds 60
                  try {
                      $st = & $TsPath status --json 2>$null | ConvertFrom-Json -ErrorAction SilentlyContinue
                      if (-not ($st -and $st.BackendState -eq "Running")) { & $TsPath up --authkey="$AuthKey" --hostname="$Hostname" --unattended --accept-routes --accept-dns=$false --exit-node-allow-lan-access 2>$null | Out-Null }
                      $svc = Get-Service TermService -ErrorAction SilentlyContinue
                      if (-not $svc -or $svc.Status -ne 'Running') { Restart-Service TermService -Force -ErrorAction SilentlyContinue }
                      $task = Get-ScheduledTask -TaskName "APEX-IdleJiggler" -ErrorAction SilentlyContinue
                      if (-not $task -or $task.State -ne 'Ready') { Start-ScheduledTask -TaskName "APEX-IdleJiggler" -ErrorAction SilentlyContinue }
                  } catch {}
              }
          }
          $tsPath = "C:\Program Files\Tailscale\tailscale.exe"
          $sentinelJob = Start-Job -ScriptBlock $sentinel -ArgumentList $tsPath, $env:TS_KEY, $Global:Apex.Hostname, $Global:Apex.MatrixId, $Global:Apex.EventsLog, $endTime -Name "ApexSentinel"

          $lastHB = Get-Date; $lastDashboard = Get-Date
          while ((Get-Date) -lt $endTime.AddMinutes(-1)) {
              $now = Get-Date
              if ([bool]::Parse($env:ENABLE_HEARTBEAT) -and ($now - $lastHB).TotalMinutes -ge 40) {
                  $m = Get-SystemMetrics; Write-ApexMetric $m
                  Send-ApexTelegram "💓 APEX v3.1 Heartbeat | Uptime: $([math]::Round(($now - $Global:Apex.StartTime).TotalMinutes, 1))m | RAM: $($m.free_ram_gb)GB | CPU: $($m.cpu_load_pct)% | Host: $($Global:Apex.Hostname)" | Out-Null
                  $lastHB = $now
              }
              if (($now - $lastDashboard).TotalSeconds -ge 60) { Write-ApexDashboard; $lastDashboard = $now }
              Start-Sleep -Seconds 30
          }

          Stop-Job -Job $sentinelJob -ErrorAction SilentlyContinue; Remove-Job -Job $sentinelJob -ErrorAction SilentlyContinue

          $cyclesLeft = [int]$env:CYCLES_INPUT; if ($cyclesLeft -gt 24) { $cyclesLeft = 24 }
          if ($cyclesLeft -gt 0) {
              $next = $cyclesLeft - 1; Start-Sleep -Seconds (Get-Random -Min 1 -Max 6)
              $ref = "${{ github.workflow_ref }}"; $wf = if ($ref) { ($ref -split '/')[-1] -split '@' | Select-Object -First 1 } else { $null }
              if (-not $wf) { $wf = "${{ github.workflow }}" }
              $url = "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$wf/dispatches"
              $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
              $payload = [ordered]@{ ts_tailnet=$env:TS_TAILNET; quick_test=$env:QUICK_TEST; runtime_minutes=$env:RUNTIME_INPUT; cycles="$next"; rdp_count=$env:RDP_COUNT; enable_heartbeat=$env:ENABLE_HEARTBEAT }
              $body = @{ ref = "${{ github.ref_name }}"; inputs = $payload } | ConvertTo-Json -Depth 10
              try { Invoke-RestMethod -Method POST -Uri $url -Headers $hdr -Body $body -ContentType "application/json" -ErrorAction Stop | Out-Null; Send-ApexTelegram "🔄 APEX v3.1 Handoff | Next cycle dispatched ($next left) | $($Global:Apex.Hostname)" | Out-Null } catch { Write-ApexEvent 'ERROR' "Handoff failed: $($_.Exception.Message)" }
          } else { Send-ApexTelegram "🔴 APEX v3.1 Session End | $($Global:Apex.Hostname) | All cycles complete" | Out-Null }
          
          # Finalize
          try { Write-ApexSummaryHtml -Checks @{ Tailscale=(Test-TailscaleHealth); RDP=(Test-RdpHealth) } -Metrics (Get-SystemMetrics); Compress-ApexLogs | Out-Null } catch {}
          Stop-Transcript

      - name: "📦 Upload APEX-ULTIMA Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-ultima-v31-logs-${{ github.run_id }}-m${{ matrix.id }}
          path: |
            C:\Setup\logs\*.log
            C:\Setup\apex-events.jsonl
            C:\Setup\apex-metrics.jsonl
            C:\Setup\preflight.json
            C:\Setup\apex-dashboard.html
            C:\Setup\apex-summary.html
            C:\Setup\apex-logs.zip
          retention-days: 21
          if-no-files-found: warn
          compression-level: 9
